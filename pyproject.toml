[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geolibre-hrdpa"
version = "0.1.0"
description = "GEE HRDPA daily precipitation to a GeoLibre-ready GeoZarr cube"
requires-python = ">=3.10"
dependencies = [
  "earthengine-api>=1.5,<2",
  "geedim>=1.9,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "rasterio>=1.3,<2",
  "xarray>=2024.6,<2027",
  "zarr>=2.18,<3",
  "numcodecs>=0.12,<0.16",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
hrdpa-pipeline = "hrdpa_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

